<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overnight results — update for Dr. Xiao</title><style>
  :root{--bg:#f7f6f3;--panel:#fff;--ink:#1b1b1a;--muted:#6f6e69;--line:#e4e2db;
    --win:#1a6b5f;--loss:#b4532a;--accent:#1a6b5f;--accent-soft:#e7f0ee;--loss-soft:#f6e9e2;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
  .slide{display:none;width:100%;max-width:1080px;animation:fade .38s ease}.slide.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:1rem}
  h1{font-size:2.9rem;line-height:1.08;letter-spacing:-.02em;font-weight:750;margin-bottom:1rem}
  h2{font-size:1.9rem;line-height:1.14;letter-spacing:-.015em;font-weight:720;margin-bottom:1.1rem}
  .lead{font-size:1.13rem;color:var(--muted);max-width:64ch}
  ul{list-style:none;display:flex;flex-direction:column;gap:.7rem;margin-top:.3rem}
  li{position:relative;padding-left:1.5rem;font-size:1.05rem;max-width:80ch}
  li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  li b{font-weight:680}.win{color:var(--win)}.loss{color:var(--loss)}.em{color:var(--accent);font-weight:680}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:.5rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
  .card .n{font-size:1.9rem;font-weight:760;font-variant-numeric:tabular-nums}
  .card .l{font-size:.88rem;color:var(--muted);margin-top:.3rem}
  .card.good{border-top:3px solid var(--win)}.card.bad{border-top:3px solid var(--loss)}
  .note{font-size:.9rem;color:var(--muted);margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--line)}
  .q{font-size:1.12rem;background:var(--accent-soft);border-left:3px solid var(--accent);padding:.7rem 1rem;border-radius:0 10px 10px 0;margin-top:.6rem}
  .warn{font-size:.98rem;background:var(--loss-soft);border-left:3px solid var(--loss);padding:.6rem .9rem;border-radius:0 10px 10px 0;margin-top:.6rem}
  .figwrap{display:flex;gap:1.4rem;align-items:center;margin-top:.4rem}
  .figwrap img{max-width:56%;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
  .figside{flex:1}
  .bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .3s;z-index:10}
  .hud{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:13px;z-index:10}
  .hud .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
  .hud .dot.on{background:var(--accent);transform:scale(1.25)}
  .ctrl{position:fixed;top:16px;right:18px;display:flex;gap:8px;z-index:10}
  .btn{font:inherit;font-size:.8rem;font-weight:650;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.35rem .7rem;border-radius:8px;cursor:pointer;box-shadow:var(--shadow)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .pg{position:fixed;bottom:14px;right:20px;font-size:.8rem;color:var(--muted);z-index:10}
  table{width:100%;border-collapse:collapse;margin-top:.4rem;font-size:.98rem}
  th,td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
  td.c,th.c{text-align:center}tr:last-child td{border-bottom:none}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.figwrap{flex-direction:column}.figwrap img{max-width:100%}}
</style></head><body>

GEMM 部分）</div>\n<h2>三个区间在真实投影形状上全部出现</h2>\n<div class=\"grid\">\n<div class=\"card bad\"><div class=\"n\">0.38–0.90×</div><div class=\"l\">kv_proj（21 MB，驻留 L2）：量化亏损 —— 一旦驱逐使其流式化则翻为小幅获胜</div></div>\n<div class=\"card good\"><div class=\"n\">2.4–3.0×</div><div class=\"l\">q/o_proj（63→31 MB）：fp8 把权重拉进 L2 —— 暖缓存、仅 mm、M≤16、锁频</div></div>\n<div class=\"card\"><div class=\"n\">→ 1.7×</div><div class=\"l\">同一格点在类服务驱逐下 —— 压缩至接近 2.0× 字节比</div></div>\n</div>\n<div class=\"warn\">如实界定：2.4–3.0× 是微基准驻留效应。多层争用下可辩护的稠密收益是字节比量级（1.7×）—— 见核心发现页。</div>\n<p class=\"note\">另测得：Marlin W8A16 在所有稠密形状上 M≈64–128 处出现反量化悬崖（低至 0.38×）；Marlin 完全无法利用 L2 层级（2.54≈2.58 TB/s）—— 这正是只有 W8A8 呈现边界效应的原因。混合 GDN 投影表现为流式。</p></div>"}, {"en": "<div class=\"slide\"><div class=\"kicker\">Todo 2 · KV cache quantization in real serving</div>\n<h2>KV reads are not limited by L2 capacity</h2>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"n\">no L2 tier</div><div class=\"l\">at ANY working set (4 MB–4.3 GB): occupancy-bound small, HBM-streamed large; eviction control moves ratios ≤0.03</div></div>\n<div class=\"card bad\"><div class=\"n\">0.69–0.72×</div><div class=\"l\">fp8-KV at small batch/context — the fp8 decode kernel's own BW ceiling (~1.6 vs bf16 ~3.0 TB/s)</div></div>\n<div class=\"card\"><div class=\"n\">≤0.2%</div><div class=\"l\">end-to-end ceiling on this model (full attention = 2.67% of runtime, from your profile)</div></div>\n</div>\n<p class=\"note\">Same kernel-BW-ceiling mechanism as FlashMLA, reproduced on a second attention family (GQA/FA3, vLLM production path). Conclusion: fp8-KV on this model is a <span class=\"em\">memory-capacity feature, not a speed feature</span> — and CARM correctly classifies the capacity term as inert here.</p></div>", "zh": "<div class=\"slide\"><div class=\"kicker\">任务 2 · 真实服务中的 KV 缓存量化</div>\n<h2>KV 读取不受 L2 容量限制</h2>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"n\">无 L2 层级</div><div class=\"l\">任何工作集（4 MB–4.3 GB）：小时受占用率限制，大时 HBM 流式；驱逐对照使比值变化 ≤0.03< +2.2 µs 对独立 +8.4 µs。</li>\n</ul></div></div></div>"}, {"en": "<div class=\"slide\"><div class=\"kicker\">Beyond the assigned items · self-directed mechanism hunt</div>\n<h2>Nine measured mechanisms that break precision routing</h2>\n<table>\n<tr><th>Mechanism</th><th>Measured magnitude (H100)</th><th class=\"c\">Routing rule</th></tr>\n<tr><td>L2 capacity gate (operand-aware)</td><td>0.70× resident → 2.4–3.0× boundary (warm)</td><td class=\"c\">don't quantize L2-resident operands</td></tr>\n<tr><td>Contention step-function</td><td>L2 tier vanishes once Σ hot WS > C_eff</td><td class=\"c\">serving ⇒ assume HBM tier</td></tr>\n<tr><td>Dequant ceiling (weight-only)</td><td>334–423 TFLOPS cap; crossover M≈64–128</td><td class=\"c\">matched precision at high M</td></tr>\n<tr><td>Act-quant tax</td><td>8.4 µs/GEMM; fused into norm: +2.2 µs</td><td class=\"c\">fuse, or W8A16 at decode</td></tr>\n<tr><td><b>Tile starvation (new)</b></td><td>Marlin +16–29 µs at N≤512; cutlass immune</td><td class=\"c\">no small-N to Marlin</td></tr>\n<tr><td><b>Misaligned wave bands (new)</b></td><td>ratio swings <b>0.75–2.71×</b> on one shape vs M</td><td class=\"c\">never interpolate across band edges</td></tr>\n<tr><td><b>Format/implementation split (new)</b></td><td>block-fp8: cutlass +15–21%, M<4 → triton fallback <b>loses to bf16</b></td><td class=\"c\">verify the dispatch, not the format</td></tr>\n<tr><td><b>Occupancy floor (new)</b></td><td>8–14% warp occupancy at M=1 (34 regs/thr — register hypothesis refuted)</td><td class=\"c\">decode = few-CTA streaming</td></tr>\n<tr><td><b>BLOCK_M staircase (new)</b></td><td>tokens 1→64 free (cutlass); Marlin re-dequants per tile</td><td class=\"c\">batch decode to tile boundaries</td></tr>\n</table></div>", "zh": "<div class=\"slide\"><div class=\"kicker\">超出指定任务 · 自主的机制排查</div>\n<h2>九个已测量的、会破坏精度路由的机制</h2>\n<table>\n<tr><th>机制</th><th>实测量级（H100）</th><th class=\"c\">路由规则</th></tr>\n<tr><td>L2 容量门控（操作数感知）</td><td>驻留时 0.70× → 边界 2.4–3.0×（暖）</td><td class=\"c\">勿量化驻留 L2 的操作数</td></tr>\n<tr><td>争用阶跃</td><td>Σ热工作集 > C_eff 即 L2 层级消失</td><td class=\"c\">服务场景 ⇒ 按 HBM 层级</td></tr>\n<tr><td>反量化上限（仅权重）</td><td>334–423 TFLOPS 封顶；交叉点 M≈64–128</td><td class=\"c\">高 M 用匹配精度</td></tr>\n<tr><td>激活量化税</td><td>8.4 µs/GEMM；融合进 norm 后 +2.2 µs</td><td class=\"c\">融合，或解码用 W8A16</td></tr>\n<tr><td><b>瓦片饥饿（新）</b></td><td>Marlin 在 N≤512 多付 16–29 µs；cutlass 免疫</td><td class=\"c\">小 N 不给 Marlin</td></tr>\n<tr><td><b>错位波量化带（新）</b></td><td>同一形状下比值随 M 摆动 <b>0.75–2.71×</b></td><td class=\"c\">决不跨带边插值</td></tr>\n<tr><td><b>格式/实现分裂（新）</b></td><td>块状 fp8：cutlass +15–21%，M<4 落到 triton 回退、<b>输给 bf16</b></td><td class=\"c\">核实际调度路径，而非格式</td></tr>\n<tr><td><b>占用率下限（新）</b></td><td>M=1 时 warp 占用 8–14%（34 寄存器/线程——寄存器假说被否）</td><td class=\"c\">解码 = 少数 CTA 的流效率</td></tr>\n<tr><td><b>BLOCK_M 阶梯（新）</b></td><td>第 1→64 个 token 免费（cutlass）；Marlin 每瓦片重复反量化</td><td class=\"c\">解码按瓦片边界组批</td></tr>\n</table></div>"}, {"en": "<div class=\"slide\"><div class=\"kicker\">What the taxonomy adds up to</div>\n<h2>A roofline is necessary — but not sufficient — for precision routing</h2>\n<ul>\n<li>The cache-aware roofline (CARM) covers the <b>physics</b>: bytes, cache tiers, compute ceilings. It fits dense bf16 at 7.4% MAPE.</li>\n<li>But three of the new mechanisms are <b>kernel-implementation properties</b> — tile counts, wave alignment, dispatch minimums — invisible to any model keyed on bytes/flops/cache. They flip win↔lose on fixed shapes.</li>\n<li>So the routing layer = <span class=\"em\">CARM + per-kernel predicates</span> (min-tiles, BLOCK_M, band edges, dispatch paths). Each predicate is one measured row of the taxonomy.</li>\n<li>This also resolves our own residuals: the 22% bf16 MAPE was mechanism 6 (bands) — irreducible for a smooth model, addressable by band tables.</li>\n</ul>\n<p class=\"note\">Reframing of the earlier discussion: \"CARM has no effect on those operators\" becomes \"the taxonomy states which term governs which operator — with nine measured rows.\" Full data: profiling/mechanisms/.</p></div>", "zh": "<div class=\"slide\"><div class=\"kicker\">这套分类学意味着什么</div>\n<h2>屋顶线对精度路由是必要的 —— 但不充分</h2>\n<ul>\n<li>缓存感知屋顶线（CARM）覆盖<b>物理</b>：字节、缓存层级、计算上限。稠密 bf16 拟合 MAPE 7.4%。</li>\n<li>但三个新机制是<b>核实现属性</b> —— 瓦片数、波对齐、调度下限 —— 任何只看字节/浮点/缓存的模型都看不见。它们能在固定形状上把胜负翻转。</li>\n<li>因此路由层 = <span class=\"em\">CARM + 每核谓词</span>（最少瓦片数、BLOCK_M、带边、调度路径）。每条谓词都是分类学中一行实测。</li>\n<li>这也解释了我们自己的残差：bf16 的 22% MAPE 即机制 6（波带）—— 平滑模型不可消除，带表可解决。</li>\n</ul>\n<p class=\"note\">对此前讨论的重构：\"CARM 对那些算子无效\"变为\"分类学明确说明哪个项支配哪个算子 —— 且九行皆为实测\"。完整数据：profiling/mechanisms/。</p></div>"}, {"en": "<div class=\"slide\"><div class=\"kicker\">Decision requested</div>\n<h2>The one untested prediction needs Blackwell</h2>\n<ul>\n<li>Every FP4 number in this project is <b>emulated</b> on H100 (no FP4 tensor cores; Marlin dequantizes to bf16 by construction).</li>\n<li>The model's sharpest falsifiable prediction — <span class=\"em\">native W4A4 breaks the dequant ceiling and wins in the compute-bound regime where emulated FP4 loses</span> — is untested on real silicon.</li>\n<li><b>B300 (Blackwell Ultra, native FP4) is available to me on Prime Intellect.</b> Harness is staged; the setup cost is a fresh Blackwell vLLM build (the H100 env lacks the native FP4 ops).</li>\n</ul>\n<div class=\"q\">Green-light the B300 native-FP4 run? Alternatively: prioritize real-model accuracy evaluation, or paper writing — your call on ordering.</div></div>", "zh": "<div class=\"slide\"><div class=\"kicker\">请您决策</div>\n<h2>唯一未验证的预测需要 Blackwell</h2>\n<ul>\n<li>本项目所有 FP4 数字在 H100 上均为<b>模拟</b>（无 FP4 张量核心；Marlin 结构上就是反量化到 bf16）。</li>\n<li>模型最锐利、最可证伪的预测 —— <span class=\"em\">原生 W4A4 突破反量化上限，在模拟 FP4 亏损的计算受限区间获胜</span> —— 尚未在真实芯片上验证。</li>\n<li><b>我可在 Prime Intellect 上使用 B300（Blackwell Ultra，原生 FP4）。</b>测试框架已就绪；准备成本是重新构建 Blackwell 版 vLLM（H100 环境缺原生 FP4 算子）。</li>\n</ul>\n<div class=\"q\">是否批准 B300 原生 FP4 实验？或者：优先真实模型精度评测、或论文写作 —— 顺序请您定。</div></div>"}];
let lang='en', i=0;
const deck=document.getElementById('deck'), hud=document.getElementById('hud'),
      bar=document.getElementById('bar'), pg=document.getElementById('pg');
function render(){
  deck.innerHTML=S[i][lang]; deck.firstElementChild.classList.add('active');
  hud.innerHTML=S.map((_,k)=>`<span class="dot ${k===i?'on':''}" onclick="go(${k})"></span>`).join('');
  bar.style.width=(i/(S.length-1)*100)+'%'; pg.textContent=(i+1)+' / '+S.length;
  document.documentElement.lang = lang;
}
function go(k){ i=Math.max(0,Math.min(S.length-1,k)); render(); }
function next(){go(i+1);} function prev(){go(i-1);}
function toggleLang(){ lang=lang==='en'?'zh':'en'; document.getElementById('langBtn').textContent=lang==='en'?'中文':'EN'; render(); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key.toLowerCase()==='l')toggleLang(); else if(e.key.toLowerCase()==='f')fs();
});
document.addEventListener('click',e=>{
  if(e.target.closest('.ctrl')||e.target.closest('.hud'))return;
  (e.clientX/window.innerWidth>0.5)?next():prev();
});
render();
</script></body></html>
