   </ul>
   <div class="q">Does this match your vision — a predictive <em>decision</em> model, vs. a broad empirical quant survey? Which matters more to you?</div></div>`,
 zh:`<div class="slide"><div class="kicker">愿景 —— 对齐确认</div><h2>我希望的方向</h2>
   <ul>
     <li>一个<b>硬件可移植的决策层</b>：给定（算子、形状、GPU），CARM 输出最优精度与核 —— 编译期/加载期查表，无需改核。</li>
     <li>把它做成<b>跨硬件预测</b>：交叉点随缓存大小 + 原生精度支持而<em>移动</em>。H100（无 FP4）→ Blackwell（原生 FP4）是干净的验证。</li>
     <li>终点：一个小而扎实的论文贡献 —— "一个可测量的缓存感知模型，用于决策混合精度，并跨算子与硬件验证"。</li>
   </ul>
   <div class="q">这是否契合您的愿景 —— 一个预测性的<em>决策</em>模型，而非一份宽泛的量化实证综述？您更看重哪一个？</div></div>`},

{ // 11 gap losses
 en:`<div class="slide"><div class="kicker">Gap A · Loss mechanisms</div><h2>We model one wall. There are more.</h2>
   <div class="cols">
   <div class="box"><h3>Modeled today</h3><ul>
     <li>HBM weight-byte bandwidth</li><li>L2 residency (capacity-gated)</li><li><b>In-core dequant ceiling</b></li></ul></div>
   <div class="box"><h3>Not yet in the model</h3><ul>
     <li><b>Accuracy</b> loss — we track kernel rel-err, not downstream perplexity/task accuracy</li>
     <li>Dynamic vs static <b>scaling</b> overhead; outlier handling</li>
     <li>Quant/repack cost &amp; <b>dual-weight memory</b> for dispatch</li>
     <li>Config raggedness (the GROUP_SIZE_M effect) &amp; launch cost</li>
     <li>Real-serving <b>L2 contention</b> (KV cache + multi-layer)</li></ul></div>
   </div>
   <div class="q">Which of these belong in the model, and which are out of scope?</div></div>`,
 zh:`<div class="slide"><div class="kicker">空白 A · 损失机制</div><h2>我们只建模了一道墙，其实不止。</h2>
   <div class="cols">
   <div class="box"><h3>当前已建模</h3><ul>
     <li>HBM 权重字节带宽</li><li>L2 驻留（受容量约束）</li><li><b>核内反量化上限</b></li></ul></div>
   <div class="box"><h3>尚未纳入模型</h3><ul>
     <li><b>精度</b>损失 —— 只跟踪核相对误差，未测下游困惑度/任务准确率</li>
     <li>动态 vs 静态<b>缩放</b>开销；离群值处理</li>
     <li>量化/重排代价与调度所需的<b>双份权重显存</b></li>
     <li>配置不平整（GROUP_SIZE_M 效应）与启动开销</li>
     <li>真实服务下的 <b>L2 争用</b>（KV 缓存 + 多层）</li></ul></div>
   </div>
   <div class="q">这些当中哪些应进入模型，哪些不在范围内？</div></div>`},

{ // 12 gap precisions
 en:`<div class="slide"><div class="kicker">Gap B · Precisions</div><h2>Coverage by precision</h2>

     <tr><td>MXFP4 / NVFP4</td><td class="c"><span class="pill p-proj">EMU</span></td><td class="c"><span class="pill p-none">none</span></td><td>no FP4 tensor cores on Hopper</td></tr>
     <tr><td>INT8 / INT4</td><td class="c"><span class="pill p-none">gap</span></td><td class="c"><span class="pill p-none">gap</span></td><td>not run on CUDA path</td></tr>
     <tr><td>W4A8, FP6, per-channel</td><td class="c"><span class="pill p-none">gap</span></td><td class="c"><span class="pill p-none">gap</span></td><td>unexplored</td></tr>

   <p class="note">The biggest testable gap on H100 <em>today</em>: <span class="em">matched W8A8 on the CUDA path</span> — the fp8 analog of the Blackwell FP4 story, on real silicon.</p></div>`,
 zh:`<div class="slide"><div class="kicker">空白 B · 精度</div><h2>按精度的覆盖情况</h2>
   <table>
     <tr><th>精度</th><th class="c">仅权重</th><th class="c">匹配 (W_A_)</th><th>H100 上状态</th></tr>
     <tr><td>FP8</td><td class="c"><span class="pill p-meas">已测</span></td><td class="c"><span class="pill p-proj">仅 Triton</span></td><td>原生；匹配尚未走 CUDA 路径</td></tr>
     <tr><td>MXFP4 / NVFP4</td><td class="c"><span class="pill p-proj">模拟</span></td><td class="c"><span class="pill p-none">无</span></td><td>Hopper 无 FP4 张量核心</td></tr>
     <tr><td>INT8 / INT4</td><td class="c"><span class="pill p-none">空白</span></td><td class="c"><span class="pill p-none">空白</span></td><td>未走 CUDA 路径</td></tr>
     <tr><td>W4A8、FP6、逐通道</td><td class="c"><span class="pill p-none">空白</span></td><td class="c"><span class="pill p-none">空白</span></td><td>未探索</td></tr>

   <p class="note"><em>当下</em>在 H100 上最可测的空白：<span class="em">CUDA 路径上的匹配 W8A8</span> —— 即 Blackwell FP4 故事的 fp8 类比，在真实芯片上验证。</p></div>`},

{ // 13 gap models
 en:`<div class="slide"><div class="kicker">Gap C · Model architectures &amp; sizes</div><h2>Coverage by operator</h2>
   <div class="cols">
   <div class="box"><h3>Covered</h3><ul>
     <li>MoE — coarse (Mixtral) &amp; fine (DeepSeek-V4-Flash, Qwen3.6-35B)</li>
     <li>MLA attention (DeepSeek, sparse + dense KV)</li></ul></div>
   <div class="box"><h3>Not covered</h3><ul>
     <li>Dense FFN / GEMM &amp; <b>GQA / MHA</b> attention</li>
     <li><b>Full-model, end-to-end</b> serving (needs multi-GPU)</li>
     <li>Long-context KV; prefill vs decode full sweep</li>
     <li>Small / dense models (the L2-resident regime)</li></ul></div>
   </div>
   <p class="note">We've profiled the two operators that dominate the targets — but the model's generality claim wants at least one dense-GEMM + one GQA data point.</p></div>`,
 zh:`<div class="slide"><div class="kicker">空白 C · 模型架构与规模</div><h2>按算子的覆盖情况</h2>
   <div class="cols">
   <div class="box"><h3>已覆盖</h3><ul>
     <li>MoE —— 粗粒度（Mixtral）与细粒度（DeepSeek-V4-Flash、Qwen3.6-35B）</li>
     <li>MLA 注意力（DeepSeek，稀疏 + 稠密 KV）</li></ul></div>
   <div class="box"><h3>未覆盖</h3><ul>
     <li>稠密 FFN / GEMM 与 <b>GQA / MHA</b> 注意力</li>
     <li><b>整模型、端到端</b>服务（需多卡）</li>
     <li>长上下文 KV；prefill vs decode 全扫描</li>
     <li>小型/稠密模型（L2 驻留区间）</li></ul></div>
   </div>
   <p class="note">我们已剖析主导目标模型的两类算子 —— 但要支撑模型的通用性主张，至少还需一个稠密 GEMM + 一个 GQA 数据点。</p></div>`},

     <tr><td>B200 / B100</td><td class="c">+ fp4</td><td class="c"><span class="pill p-proj">projected</span></td><td class="c"><span class="pill p-none">none</span></td></tr>
     <tr><td><b>B300</b> (Blackwell Ultra)</td><td class="c">+ fp4</td><td class="c"><span class="pill p-proj">projected</span></td><td class="c"><span class="pill p-none">none</span></td></tr>
   </table>
   <p class="note">The whole cross-hardware claim rests on <span class="em">one measured GPU</span>. Blackwell is the missing leg — and it's where the model makes its most falsifiable prediction.</p></div>`,
 zh:`<div class="slide"><div class="kicker">空白 D · 硬件剖析与标定</div><h2>真正被测量的只有一块 GPU</h2>
   <table>
     <tr><th>GPU</th><th class="c">原生精度</th><th class="c">CARM 参数</th><th class="c">已跑算子</th></tr>
     <tr><td><b>H100</b>（Hopper）</td><td class="c">int8, fp8</td><td class="c"><span class="pill p-meas">已测</span></td><td class="c"><span class="pill p-meas">MoE + MLA</span></td></tr>
     <tr><td>A100（Ampere）</td><td class="c">int8</td><td class="c"><span class="pill p-proj">缩放估计</span></td><td class="c"><span class="pill p-none">—</span></td></tr>
     <tr><td>B200 / B100</td><td class="c">+ fp4</td><td class="c"><span class="pill p-proj">推测</span></td><td class="c"><span class="pill p-none">无</span></td></tr>
     <tr><td><b>B300</b>（Blackwell Ultra）</td><td class="c">+ fp4</td><td class="c"><span class="pill p-proj">推测</span></td><td class="c"><span class="pill p-none">无</span></td></tr>

{ // 15 b300 hypothesis
 en:`<div class="slide"><div class="kicker">B300 · What we'd expect to measure</div><h2>The cross-hardware prediction (hypothesis)</h2>
   <div class="grid">
     <div class="card bad"><div class="n">H100</div><div class="l">FP4 emulated → weight-only <b>loses</b> at high T (0.6×). Dequant ceiling in silicon.</div></div>
     <div class="card good"><div class="n">B300</div><div class="l">Native FP4 MMA → <b>matched W4A4 breaks the ceiling</b> → wins across the whole token range.</div></div>
     <div class="card"><div class="n">shift</div><div class="l">Bigger L2 (~2–3× H100) → weight-only crossover moves later; the "always-quantize" set grows.</div></div>
   </div>
   <p class="note">Concrete falsifiable claim: on B300, matched-FP4 stays <span class="win">&gt;1× where H100 emulated-FP4 drops to 0.6×</span> — same shape, same bench, only the silicon changes. B300 available on Prime Intellect (no B100/B200 right now).</p></div>`,
 zh:`<div class="slide"><div class="kicker">B300 · 我们预期能测到什么</div><h2>跨硬件预测（假设）</h2>
   <div class="grid">
     <div class="card bad"><div class="n">H100</div><div class="l">FP4 为模拟 → 仅权重在大 T <b>亏损</b>（0.6×）。反量化上限存在于硅片。</div></div>
     <div class="card good"><div class="n">B300</div><div class="l">原生 FP4 MMA → <b>匹配 W4A4 突破上限</b> → 在整个 token 区间获胜。</div></div>
     <div class="card"><div class="n">位移</div><div class="l">更大 L2（约 H100 的 2–3×）→ 仅权重交叉点后移；"始终量化"集合扩大。</div></div>
   </div>
   <p class="note">可证伪的具体主张：在 B300 上，匹配 FP4 在 <span class="win">H100 模拟 FP4 跌到 0.6× 之处仍保持 &gt;1×</span> —— 相同形状、相同基准，只换硅片。B300 在 Prime Intellect 可用（目前无 B100/B200）。</p></div>`},

{ // 16 asks / close
 en:`<div class="slide"><div class="kicker">Decisions I'd like from you</div><h2>Where should we point next?</h2>
   <ul>
     <li><b>Scope:</b> predictive decision model vs. broad empirical survey — which is the paper?</li>
     <li><b>Precisions:</b> run matched W8A8 on CUDA (H100, now) as the FP4 rehearsal? add INT4/INT8?</li>
     <li><b>Breadth:</b> add a dense-GEMM + GQA data point for generality, or stay MoE/MLA-deep?</li>
     <li><b>Hardware:</b> prioritize the <b>B300</b> run (Prime Intellect) to land the native-FP4 leg?</li>
   </ul>
   <div class="q">My lean: lock the decision-model framing, do W8A8-on-CUDA now, then B300 for the native-FP4 proof. Your call on breadth vs. depth.</div></div>`,

   <ul>
     <li><b>定位：</b>预测性决策模型 vs. 宽泛实证综述 —— 论文取哪个？</li>
     <li><b>精度：</b>现在就在 CUDA（H100）上跑匹配 W8A8，作为 FP4 的预演？是否加 INT4/INT8？</li>
     <li><b>广度：</b>为通用性加一个稠密 GEMM + GQA 数据点，还是继续在 MoE/MLA 上做深？</li>
     <li><b>硬件：</b>优先安排 <b>B300</b> 运行（Prime Intellect）以拿下原生 FP4 一环？</li>
   </ul>
   <div class="q">我的倾向：先锁定"决策模型"这一定位，现在跑 CUDA 上的 W8A8，然后用 B300 做原生 FP4 的证明。广度 vs. 深度请您定夺。</div></div>`},
];

/* ---------- engine ---------- */
let lang='en', i=0;
const deck=document.getElementById('deck'), hud=document.getElementById('hud'),
      bar=document.getElementById('bar'), pg=document.getElementById('pg'), brand=document.getElementById('brand');
function render(){
  deck.innerHTML=S[i][lang];
  deck.firstElementChild.classList.add('active');
  hud.innerHTML=S.map((_,k)=>`<span class="dot ${k===i?'on':''}" onclick="go(${k})"></span>`).join('');
  bar.style.width=((i)/(S.length-1)*100)+'%';
  pg.textContent=(i+1)+' / '+S.length;
  brand.textContent = lang==='en' ? 'Cache-Aware Mixed Precision' : '缓存感知混合精度';
  document.documentElement.lang = lang==='en'?'en':'zh';
}
function go(k){ i=Math.max(0,Math.min(S.length-1,k)); render(); }
function next(){ go(i+1); } function prev(){ go(i-1); }
function toggleLang(){ lang=lang==='en'?'zh':'en'; document.getElementById('langBtn').textContent=lang==='en'?'中文':'EN'; render(); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(S.length-1);
  else if(e.key.toLowerCase()==='l')toggleLang();
  else if(e.key.toLowerCase()==='f')fs();
});
document.addEventListener('click',e=>{
  if(e.target.closest('.ctrl')||e.target.closest('.hud'))return;
  const x=e.clientX/window.innerWidth; if(x>0.5)next(); else prev();
});
render();
</script>
